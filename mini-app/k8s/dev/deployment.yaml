apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-app
  template:
    metadata:
      labels:
        app: mini-app
    spec:
      containers:
      - name: mini-app
        image: placeholder/mini-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: ENV
          value: "development"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: mini-app-service
  namespace: dev
spec:
  selector:
    app: mini-app
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP