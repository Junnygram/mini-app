apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-app
  template:
    metadata:
      labels:
        app: mini-app
    spec:
      containers:
      - name: mini-app
        image: placeholder/mini-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: ENV
          value: "staging"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: mini-app-service
  namespace: staging
spec:
  selector:
    app: mini-app
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer