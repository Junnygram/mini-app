apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-app
  labels:
    app: mini-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mini-app
  template:
    metadata:
      labels:
        app: mini-app
    spec:
      containers:
        - name: app
          image: <DOCKER_USERNAME>/mini-app:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: student-ci-service
spec:
  selector:
    app: mini-app
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
